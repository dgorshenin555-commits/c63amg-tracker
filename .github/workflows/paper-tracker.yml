name: C63AMG Paper Tracker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-tracker.yml'
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      telegram_action:
        description: 'Telegram setup: none, discover chat, or send test alert'
        type: choice
        default: none
        options:
          - none
          - discover
          - test
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: c63amg-paper
  cancel-in-progress: false
jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect and simulate
        run: python monitor.py
      - name: Save virtual account
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Paper-trading snapshot [skip ci]"
            git push
          fi
      - name: Notify about new simulated trades in Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFY_MODE: ${{ vars.TELEGRAM_NOTIFY_MODE || 'all' }}
        run: python notify_telegram.py
      - name: Discover Telegram chat ID
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_action == 'discover'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python notify_telegram.py --discover
      - name: Send Telegram test notification
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_action == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py --test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
