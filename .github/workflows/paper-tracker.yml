name: C63AMG Dashboard Archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-tracker.yml'
      - 'site/**'
      - 'server/**'
      - 'notify_telegram.py'
      - 'test_*.py'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: c63amg-static-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify paper account and persistent tunnel
        run: python -m unittest -q test_quick_tunnel.py test_telegram.py test_monitor_vps.py test_server_runner.py test_valuation.py
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare archived dashboard snapshot
        run: |
          cp state.json site/state.json
          python3 - <<'PY'
          from pathlib import Path
          import html
          notice = (
              '<aside role="status" style="background:#fff2d9;color:#764a13;'
              'font:600 13px/1.5 system-ui;padding:13px 18px;text-align:center;'
              'border-bottom:1px solid #efdbb3;">'
              'АРХИВНАЯ ПАНЕЛЬ GITHUB · Эти цифры больше не обновляются. '
              'Актуальный виртуальный счёт работает на Vultr VPS.'
              '</aside>'
          )
          for name in ('site/index.html', 'site/dashboard/index.html'):
              path = Path(name)
              content = path.read_text()
              if '<body>' in content and 'АРХИВНАЯ ПАНЕЛЬ GITHUB' not in content:
                  path.write_text(content.replace('<body>', '<body>' + notice, 1))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
